name: Bug report
description: Report reproducible Smart Shading behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before reporting, read SUPPORT.md and search existing issues. Remove personal names, entity IDs, addresses, URLs, tokens, and installation-specific data from diagnostics and logs.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and checked the troubleshooting guidance.
          required: true
        - label: I removed private and installation-specific data.
          required: true
  - type: input
    id: version
    attributes:
      label: Smart Shading version
      placeholder: Copy the installed version shown by HACS
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: setup_mode
    attributes:
      label: Setup mode
      options:
        - Easy
        - Advanced
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant diagnostics or logs
      description: Include the Card reason and the smallest sanitized evidence that shows the problem.
      render: shell
