name: Home Assistant UI E2E

on:
  workflow_call:
  pull_request:
    paths:
      - 'custom_components/smart_shading/**'
      - 'e2e/ha/**'
      - 'scripts/ha_e2e/**'
      - 'e2e/ui/**'
      - '.github/workflows/ha-ui-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        working-directory: e2e/ui
        run: npm install --ignore-scripts
      - name: Install Playwright media helper
        working-directory: e2e/ui
        run: npx playwright install ffmpeg
      - name: Verify preinstalled runner Chrome
        run: google-chrome --version
      - name: Run real Home Assistant wizard and card browser tests
        env:
          HA_E2E_RUN_UI: '1'
          HA_E2E_PORT: '18125'
          HA_E2E_BROWSER_CHANNEL: 'chrome'
          HA_E2E_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/ha-ui-e2e/home-assistant
        run: scripts/ha_e2e/run_lab.sh
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-ui-e2e-${{ github.sha }}
          path: artifacts/ha-ui-e2e
          if-no-files-found: warn
          retention-days: 14
