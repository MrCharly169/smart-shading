name: Published Release HACS Qualification

on:
  workflow_call:
    inputs:
      tag:
        description: Published Smart Shading tag to install through HACS
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published Smart Shading tag to install through HACS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smart-shading-hacs-lab
  cancel-in-progress: false

jobs:
  hacs-install-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HACS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/ha-hacs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify HACS selects the published tag and download its source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ha_e2e/check_hacs_release.py
          --repository "${{ github.repository }}"
          --tag "$RELEASE_TAG"
          --output "$HACS_ARTIFACT_DIR/recognition.json"
          --install-archive "$HACS_ARTIFACT_DIR/smart_shading-$RELEASE_TAG.zip"
      - name: Validate the exact tag with the official HACS backend
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        env:
          REPOSITORY_REF: ${{ inputs.tag }}
        with:
          category: integration
          repository: ${{ github.repository }}
          comment: 'false'
      - name: Run the HACS-resolved release in a fresh Home Assistant
        env:
          HA_E2E_PORT: '18135'
          HA_E2E_RELEASE_ARCHIVE: ${{ env.HACS_ARTIFACT_DIR }}/smart_shading-${{ env.RELEASE_TAG }}.zip
          HA_E2E_ARTIFACT_DIR: ${{ env.HACS_ARTIFACT_DIR }}/home-assistant
        run: scripts/ha_e2e/run_lab.sh
      - name: Upload HACS qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-hacs-${{ env.RELEASE_TAG }}
          path: artifacts/ha-hacs
          if-no-files-found: error
          retention-days: 30
