name: Validate

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require changelog for production changes
        if: github.event_name == 'pull_request'
        run: python scripts/check_pr_changelog.py "origin/${{ github.base_ref }}"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Verify wizard E2E ownership
        run: python scripts/ha_e2e/check_wizard_coverage.py
      - name: Validate all source and workflow syntax
        run: python scripts/check_source_syntax.py
      - name: Frontend runtime regression test
        run: |
          node tests/test_card_runtime.js
          node tests/test_browser_error_attribution.js
      - name: Validate release structure
        run: python scripts/build_release.py --check
      - name: Build installable archive
        run: python scripts/build_release.py --output dist/smart_shading.zip
      - uses: actions/upload-artifact@v4
        with:
          name: smart-shading-${{ github.sha }}
          path: dist/smart_shading.zip
