name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - beta
          - stable
      version:
        description: Requested version without a leading v
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: smart-shading-prepare-release-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.channel }} release PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.channel == 'stable' && 'main' || 'develop' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Resolve release metadata
        id: metadata
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$CHANNEL" == "beta" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^20[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+b[0-9]+$ ]]; then
              echo "::error::Beta versions must match YYYY.M.PATCHbN without a leading v."
              exit 1
            fi
            TARGET_BRANCH="develop"
          else
            if [[ ! "$REQUESTED_VERSION" =~ ^20[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
              echo "::error::Stable versions must match YYYY.M.PATCH without a leading v."
              exit 1
            fi
            TARGET_BRANCH="main"
          fi

          RELEASE_DATE="$(date -u +%F)"
          RELEASE_BRANCH="release/v$REQUESTED_VERSION"
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_branch=develop" >> "$GITHUB_OUTPUT"
          echo "target_branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"

      - name: Reject an existing tag, release, or release branch
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.metadata.outputs.release_branch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists. Release versions are immutable."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Release versions are immutable."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$RELEASE_BRANCH"; then
            echo "::error::Branch $RELEASE_BRANCH already exists. Review or remove it first."
            exit 1
          fi

      - name: Create local release branch and integrate tested develop state
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_BRANCH: ${{ steps.metadata.outputs.release_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RELEASE_BRANCH"

          if [[ "$CHANNEL" != "stable" ]]; then
            exit 0
          fi

          git fetch --no-tags origin develop:refs/remotes/origin/develop
          if ! git merge --no-commit --no-ff origin/develop; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            UNEXPECTED=()
            for FILE in "${CONFLICTS[@]}"; do
              if [[ "$FILE" != ".github/workflows/release.yml" ]] || \
                 git ls-files -u -- "$FILE" | awk '{print $3}' | grep -qx '1'; then
                UNEXPECTED+=("$FILE")
              fi
            done

            if (( ${#CONFLICTS[@]} == 0 || ${#UNEXPECTED[@]} > 0 )); then
              printf '::error::Stable promotion has unresolved conflicts: %s\n' \
                "${UNEXPECTED[*]:-unknown merge failure}"
              git merge --abort
              exit 1
            fi

            echo "::notice::Using the tested develop version of the historical release workflow add/add conflict."
            git checkout --theirs -- .github/workflows/release.yml
            git add .github/workflows/release.yml
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "::error::Stable promotion still contains unresolved merge conflicts."
            git merge --abort
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge tested develop state for Smart Shading v$VERSION"
          fi

      - name: Prepare version and changelog
        shell: bash
        run: >-
          python scripts/release_changelog.py prepare
          --channel "${{ inputs.channel }}"
          --source-branch "develop"
          --target-branch "${{ steps.metadata.outputs.target_branch }}"
          --version "${{ steps.metadata.outputs.version }}"
          --date "${{ steps.metadata.outputs.release_date }}"

      - name: Verify package metadata
        run: >-
          python scripts/build_release.py
          --check
          --tag "${{ steps.metadata.outputs.tag }}"
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate all source and workflow syntax
        run: python scripts/check_source_syntax.py
      - name: Run frontend regression tests
        run: |
          node tests/test_card_runtime.js
          node tests/test_browser_error_attribution.js
      - name: Build installation archive
        run: >-
          python scripts/build_release.py
          --tag "${{ steps.metadata.outputs.tag }}"
          --output "dist/smart_shading-${{ steps.metadata.outputs.tag }}.zip"

      - name: Commit and push release preparation
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_BRANCH: ${{ steps.metadata.outputs.release_branch }}
        run: |
          git add custom_components/smart_shading/manifest.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::Release preparation produced no reviewable changes."
            exit 1
          fi
          git commit -m "Prepare Smart Shading v$VERSION"
          git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Create draft release pull request
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_BRANCH: ${{ steps.metadata.outputs.source_branch }}
          TARGET_BRANCH: ${{ steps.metadata.outputs.target_branch }}
          RELEASE_BRANCH: ${{ steps.metadata.outputs.release_branch }}
          RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
        run: |
          PR_BODY="$RUNNER_TEMP/release-pr.md"
          printf '%s\n' \
            '## Release preparation' \
            '' \
            "- Channel: \`$CHANNEL\`" \
            "- Version: \`$VERSION\`" \
            "- Source branch: \`$SOURCE_BRANCH\`" \
            "- Target branch: \`$TARGET_BRANCH\`" \
            "- Preparation date: \`$RELEASE_DATE\`" \
            '' \
            '## Maintainer review' \
            '' \
            '- [ ] Version and release channel are correct' \
            '- [ ] Changelog content is complete, clear, and publication-ready' \
            '- [ ] Required documentation changes are already included' \
            '- [ ] Migration and breaking-change impact has been reviewed' \
            '- [ ] Python, frontend, regression, and package checks pass' \
            '- [ ] This beta or stable release is ready to publish after merge' \
            '' \
            'This pull request only prepares the release metadata. It does not merge or publish a release.' \
            '' \
            'It does not automatically close a delivery issue. Close the parent issue only after the published tag passes HACS qualification.' > "$PR_BODY"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "Prepare Smart Shading v$VERSION" \
            --body-file "$PR_BODY" \
            --draft

      - name: Dispatch pull request validation
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.metadata.outputs.release_branch }}
        run: >-
          gh workflow run validate.yml
          --repo "$GITHUB_REPOSITORY"
          --ref "$RELEASE_BRANCH"
