name: Release

on:
  push:
    branches:
      - develop
      - main
    paths:
      - custom_components/smart_shading/manifest.json
  workflow_dispatch:
    inputs:
      confirm_version:
        description: For a manual retry, type the exact manifest version (without v)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: smart-shading-release
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Resolve branch release channel
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve branch and manifest version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/smart_shading/manifest.json"))["version"])')"
          CHANNEL=""
          if [[ "$BRANCH" == "develop" && "$VERSION" =~ ^20[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+b[0-9]$ ]]; then
            CHANNEL="beta"
          elif [[ "$BRANCH" == "main" && "$VERSION" =~ ^20[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
            CHANNEL="stable"
          fi

          if [[ -z "$CHANNEL" ]]; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::The manifest version does not match the release channel for $BRANCH."
              exit 1
            fi
            echo "::notice::The manifest change synchronizes branch state and is not a release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "channel=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

  ha-e2e:
    name: Required real Home Assistant gate
    needs: release-metadata
    if: needs.release-metadata.outputs.publish == 'true'
    uses: ./.github/workflows/ha-e2e.yml

  ha-ui-e2e:
    name: Required real Home Assistant browser gate
    needs: release-metadata
    if: needs.release-metadata.outputs.publish == 'true'
    uses: ./.github/workflows/ha-ui-e2e.yml

  ha-upgrade-e2e:
    name: Required previous-release upgrade gate
    needs: release-metadata
    if: needs.release-metadata.outputs.publish == 'true'
    uses: ./.github/workflows/ha-upgrade-e2e.yml

  ha-matrix-e2e:
    name: Required stable and beta Home Assistant gate
    needs: release-metadata
    if: needs.release-metadata.outputs.publish == 'true'
    uses: ./.github/workflows/ha-nightly.yml
    with:
      candidate_ref: ${{ github.sha }}

  release:
    name: Publish branch release
    needs:
      - release-metadata
      - ha-e2e
      - ha-ui-e2e
      - ha-upgrade-e2e
      - ha-matrix-e2e
    if: needs.release-metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Read manifest version
        id: metadata
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/smart_shading/manifest.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate selected channel, branch, version, and changelog
        env:
          CHANNEL: ${{ needs.release-metadata.outputs.channel }}
          CONFIRM_VERSION: ${{ github.event_name == 'push' && steps.metadata.outputs.version || inputs.confirm_version }}
        run: >-
          python scripts/validate_release_channel.py
          --channel "$CHANNEL"
          --branch "${{ github.ref_name }}"
          --confirm-version "$CONFIRM_VERSION"

      - name: Reject an existing release tag
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists. Release versions are immutable."
            exit 1
          fi

      - name: Verify package metadata
        run: >-
          python scripts/build_release.py
          --check
          --tag "${{ steps.metadata.outputs.tag }}"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate all source and workflow syntax
        run: python scripts/check_source_syntax.py
      - name: Run frontend regression tests
        run: |
          node tests/test_card_runtime.js
          node tests/test_browser_error_attribution.js

      - name: Build manual installation archive
        run: >-
          python scripts/build_release.py
          --tag "${{ steps.metadata.outputs.tag }}"
          --output "dist/smart_shading-${{ steps.metadata.outputs.tag }}.zip"

      - name: Extract changelog release notes
        run: >-
          python scripts/release_changelog.py notes
          --version "${{ steps.metadata.outputs.version }}"
          --output dist/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Smart Shading ${{ steps.metadata.outputs.tag }}
          prerelease: ${{ github.ref_name == 'develop' }}
          make_latest: ${{ github.ref_name == 'main' }}
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: dist/smart_shading-${{ steps.metadata.outputs.tag }}.zip

  ha-hacs-qualification:
    name: Qualify published tag through isolated HACS
    needs: release
    uses: ./.github/workflows/ha-hacs-e2e.yml
    with:
      tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit
